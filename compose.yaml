name: evidence-frontier
services:
  workbench:
    build:
      context: .
      target: controller
    image: evidence-frontier:0.1.0
    init: true
    restart: unless-stopped
    environment:
      DATA_ROOT: /app/data
      WORKER_URL: http://forensic-worker:8766
      WORKER_TIMEOUT: ${WORKER_TIMEOUT:-14400}
      WORKER_TOKEN: ${WORKER_TOKEN:?Run the setup script first}
      WORKBENCH_TOKEN: ${WORKBENCH_TOKEN:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT: ${MODEL_TIMEOUT:-300}
      MODEL_RELAY_URL: http://model-relay:8768
      MODEL_UPSTREAM_URL: ${MODEL_UPSTREAM_URL:-http://host.docker.internal:11434}
      INVESTIGATION_MODEL_CALLS: ${INVESTIGATION_MODEL_CALLS:-12}
      FRONTIER_RELEASE: ${FRONTIER_RELEASE:-unrecorded}
      FRONTIER_MODEL_DIGEST: ${FRONTIER_MODEL_DIGEST:-unverified}
      FRONTIER_WORKER_IMAGE: ${FRONTIER_WORKER_IMAGE:-unverified}
      FRONTIER_WORKER_SOURCE_SHA256: ${FRONTIER_WORKER_SOURCE_SHA256:-unverified}
      ANALYSIS_ROOT: /analysis
      OPENRELIK_URL: ${OPENRELIK_URL:-}
      OPENRELIK_TOKEN: ${OPENRELIK_TOKEN:-}
    volumes:
      - case-data:/app/data
      - analysis-data:/analysis:ro
      - ./config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [worker-plane,model-plane]
    depends_on:
      model-relay:
        condition: service_healthy
      forensic-worker:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=128M,mode=1777"]
  gateway:
    image: evidence-frontier:0.1.0
    command: ["uvicorn","workbench.gateway:app","--host","0.0.0.0","--port","8765"]
    init: true
    restart: unless-stopped
    ports: ["127.0.0.1:${WORKBENCH_PORT:-8765}:8765"]
    depends_on:
      workbench:
        condition: service_healthy
    networks: [model-plane,ui-ingress]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=32M,mode=1777"]
    mem_limit: 256m
    cpus: 1
  model-relay:
    image: evidence-frontier:0.1.0
    command: ["uvicorn","workbench.model_relay:app","--host","0.0.0.0","--port","8768"]
    init: true
    restart: unless-stopped
    environment:
      MODEL_UPSTREAM_URL: ${MODEL_UPSTREAM_URL:-http://host.docker.internal:11434}
      MODEL_UPSTREAM_TRUSTED_LAN: ${MODEL_UPSTREAM_TRUSTED_LAN:-0}
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [model-plane,model-egress]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=32M,mode=1777"]
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8768/health')"]
      interval: 15s
      timeout: 5s
      start_period: 5s
  forensic-worker:
    build:
      context: .
      target: worker
    image: evidence-frontier-worker:0.1.0
    init: true
    restart: unless-stopped
    environment:
      EVIDENCE_ROOT: /evidence
      WORKER_TOKEN: ${WORKER_TOKEN:?Run the setup script first}
      EWF_TIMEOUT: ${EWF_TIMEOUT:-7200}
      ANALYSIS_ROOT: /analysis
      HUNT_BUDGET_GIB: ${HUNT_BUDGET_GIB:-8}
    volumes:
      - analysis-data:/analysis
      - type: bind
        source: ${EVIDENCE_PATH:-./examples}
        target: /evidence
        read_only: true
    networks: [worker-plane]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=256M,mode=1777"]
    mem_limit: ${WORKER_MEMORY:-4g}
    cpus: 2
networks:
  worker-plane:
    internal: true
  model-plane:
    internal: true
  model-egress: {}
  ui-ingress: {}
volumes:
  case-data: {}
  analysis-data: {}
