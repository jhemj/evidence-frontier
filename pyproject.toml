[project]
name = "evidence-frontier"
version = "0.1.0"
description = "Local AI forensic workbench with deterministic evidence control"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1.6,<4",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0.1,<4",
]

[dependency-groups]
dev = ["pytest>=8,<9"]
worker = [
    "dissect-extfs>=3,<4",
    "dissect-target>=3.20,<4",
    "dissect-xfs>=3.12,<4",
    "yara-python>=4.5,<5",
    "pyelftools>=0.32,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
